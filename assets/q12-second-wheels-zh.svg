<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="title"><title id="title">第二段矿井：中央岔路、东长廊与矿堆旁矿车</title>
<rect width="640" height="470" rx="10" fill="#f5f8f9" />
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#295d73" stroke-width="2" /></marker></defs>
<path data-from="entrance" data-to="junction" d="M300 370V190" fill="none" stroke="#295d73" stroke-width="3" />
<path data-from="junction" data-to="C1" d="M300 190V84" fill="none" stroke="#295d73" stroke-width="3" />
<path data-from="junction" data-to="C2" d="M300 190H100V300" fill="none" stroke="#295d73" stroke-width="3" />
<path data-from="junction" data-to="east" d="M300 190H530" fill="none" stroke="#295d73" stroke-width="3" />
