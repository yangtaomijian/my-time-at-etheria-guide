<text x="540.0" y="355.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#24303a" stroke="#f5f8f9" stroke-width="4" paint-order="stroke">C4 · 最右侧</text>
</g>
<g data-node="cart"><rect x="100" y="400" width="170" height="54" rx="7" fill="#fff" stroke="#9ab8c4" stroke-width="2" />
