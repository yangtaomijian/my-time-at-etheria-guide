</g>
<text x="300" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#24303a" stroke="#f5f8f9" stroke-width="4" paint-order="stroke">中央岔路</text>
<text x="415" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#24303a" stroke="#f5f8f9" stroke-width="4" paint-order="stroke">东侧长廊</text>
