<path data-from="east" data-to="C4" d="M530 190V250H500V280H540V325" fill="none" stroke="#295d73" stroke-width="3" />
<path data-from="junction" data-to="cart" d="M300 190V350H185V400" fill="none" stroke="#295d73" stroke-width="3" />
<circle data-node="junction" cx="300" cy="190" r="5" fill="#295d73" />
<circle data-node="east" cx="530" cy="190" r="5" fill="#295d73" />
<g data-node="C1"><rect x="230" y="34" width="140" height="50" rx="7" fill="#fff" stroke="#9ab8c4" stroke-width="2" />
<text x="300.0" y="64.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#24303a" stroke="#f5f8f9" stroke-width="4" paint-order="stroke">C1 · 中央北端</text>
</g>
<g data-node="C2"><rect x="15" y="300" width="170" height="50" rx="7" fill="#fff" stroke="#9ab8c4" stroke-width="2" />
<text x="100.0" y="330.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#24303a" stroke="#f5f8f9" stroke-width="4" paint-order="stroke">C2 · 西侧凹处</text>
</g>
<g data-node="C3"><rect x="480" y="34" width="140" height="50" rx="7" fill="#fff" stroke="#9ab8c4" stroke-width="2" />
