<path data-from="entrance" data-to="central" d="M330 535V250" fill="none" stroke="#295d73" stroke-width="3" />
<path data-from="central" data-to="east-upper" d="M330 250V150H550" fill="none" stroke="#295d73" stroke-width="3" />
<path data-from="central" data-to="left" d="M330 250H110" fill="none" stroke="#295d73" stroke-width="3" />
<path data-from="left" data-to="cart" d="M110 250V187" fill="none" stroke="#295d73" stroke-width="3" />
<path data-from="cart" data-to="A2" d="M110 137V118H130V100H110V82" fill="none" stroke="#295d73" stroke-width="3" />
