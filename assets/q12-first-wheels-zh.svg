</g>
<g data-node="A4"><rect x="480" y="380" width="140" height="50" rx="7" fill="#fff" stroke="#9ab8c4" stroke-width="2" />
<text x="550.0" y="411.08" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#24303a" stroke="#f5f8f9" stroke-width="4" paint-order="stroke">A4 · 最右车轮</text>
