<text x="110.0" y="63.08" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#24303a" stroke="#f5f8f9" stroke-width="4" paint-order="stroke">A2 · 左上车轮</text>
</g>
<g data-node="cart"><rect x="40" y="137" width="140" height="50" rx="7" fill="#fff" stroke="#9ab8c4" stroke-width="2" />
