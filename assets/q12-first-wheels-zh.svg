<path data-from="entrance" data-to="A1" d="M330 490H420" fill="none" stroke="#295d73" stroke-width="3" />
<circle data-node="central" cx="330" cy="250" r="5" fill="#295d73" />
<circle data-node="left" cx="110" cy="250" r="5" fill="#295d73" />
