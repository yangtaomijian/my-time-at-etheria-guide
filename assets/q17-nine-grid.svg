<svg xmlns="http://www.w3.org/2000/svg" width="320" height="328" viewBox="0 0 320 328" role="img" aria-labelledby="title desc">
<title id="title">九宫格初始解法</title>
<desc id="desc">面向屏幕的三行三列。此前一处也没按过时，按金色的四角与中央各一次：左上、右上、中央、左下、右下。</desc>
<rect x="1" y="1" width="318" height="326" rx="12" fill="#faf8f2" stroke="#d6d0c2"/>
<g font-family="system-ui, sans-serif" text-anchor="middle">
<text x="160" y="30" font-size="18" fill="#3a3730">九宫格初始解法</text>
<rect x="24" y="50" width="80" height="62" rx="7" fill="#f0dca7" stroke="#92723c"/>
<text x="64" y="75" font-size="17" fill="#3a3730">左上</text>
<text x="64" y="98" font-size="15" fill="#615d54">点一次</text>
<rect x="120" y="50" width="80" height="62" rx="7" fill="#e6e8e9" stroke="#a7acae"/>
<text x="160" y="75" font-size="17" fill="#3a3730">上中</text>
<text x="160" y="98" font-size="15" fill="#615d54">不按</text>
<rect x="216" y="50" width="80" height="62" rx="7" fill="#f0dca7" stroke="#92723c"/>
<text x="256" y="75" font-size="17" fill="#3a3730">右上</text>
<text x="256" y="98" font-size="15" fill="#615d54">点一次</text>
<rect x="24" y="128" width="80" height="62" rx="7" fill="#e6e8e9" stroke="#a7acae"/>
<text x="64" y="153" font-size="17" fill="#3a3730">左中</text>
<text x="64" y="176" font-size="15" fill="#615d54">不按</text>
<rect x="120" y="128" width="80" height="62" rx="7" fill="#f0dca7" stroke="#92723c"/>
<text x="160" y="153" font-size="17" fill="#3a3730">中央</text>
<text x="160" y="176" font-size="15" fill="#615d54">点一次</text>
<rect x="216" y="128" width="80" height="62" rx="7" fill="#e6e8e9" stroke="#a7acae"/>
<text x="256" y="153" font-size="17" fill="#3a3730">右中</text>
<text x="256" y="176" font-size="15" fill="#615d54">不按</text>
<rect x="24" y="206" width="80" height="62" rx="7" fill="#f0dca7" stroke="#92723c"/>
<text x="64" y="231" font-size="17" fill="#3a3730">左下</text>
<text x="64" y="254" font-size="15" fill="#615d54">点一次</text>
<rect x="120" y="206" width="80" height="62" rx="7" fill="#e6e8e9" stroke="#a7acae"/>
<text x="160" y="231" font-size="17" fill="#3a3730">下中</text>
<text x="160" y="254" font-size="15" fill="#615d54">不按</text>
<rect x="216" y="206" width="80" height="62" rx="7" fill="#f0dca7" stroke="#92723c"/>
<text x="256" y="231" font-size="17" fill="#3a3730">右下</text>
<text x="256" y="254" font-size="15" fill="#615d54">点一次</text>
<text x="160" y="302" font-size="15" fill="#615d54">仅适用于此前未操作的状态</text>
</g></svg>
