<svg xmlns="http://www.w3.org/2000/svg" width="320" height="415" viewBox="0 0 320 415" role="img" aria-labelledby="title desc">
<title id="title">Water Realm: seven colors</title><desc id="desc">Step on the seven colors in order, then use the north door.</desc>
<rect x="1" y="1" width="318" height="413" rx="12" fill="#faf8f2" stroke="#d6d0c2"/>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#3a3730">
<text x="160" y="29" font-size="17">Water Realm: seven colors</text>
<text x="160" y="53" font-size="14">Approximate positions. North is up.</text>
<rect x="76" y="67" width="168" height="31" rx="5" fill="#f0dca7" stroke="#92723c"/>
<text x="160" y="88" font-size="15">Interact with north door</text>
<circle cx="160" cy="287" r="13" fill="#b63a40" stroke="#3a3730"/>
<text x="160" y="292" font-size="15" fill="#fff">1</text>
<text x="160" y="321" font-size="15">Red</text>
<circle cx="184" cy="145" r="13" fill="#d16c20" stroke="#3a3730"/>
<text x="184" y="150" font-size="15" fill="#fff">2</text>
<text x="184" y="179" font-size="15">Orange</text>
<circle cx="256" cy="213" r="13" fill="#f1d45c" stroke="#3a3730"/>
<text x="256" y="218" font-size="15" fill="#3a3730">3</text>
<text x="256" y="247" font-size="15">Yellow</text>
<circle cx="32" cy="213" r="13" fill="#3c8155" stroke="#3a3730"/>
<text x="32" y="218" font-size="15" fill="#fff">4</text>
<text x="32" y="247" font-size="15">Green</text>
<circle cx="136" cy="145" r="13" fill="#3378a8" stroke="#3a3730"/>
<text x="136" y="150" font-size="15" fill="#fff">5</text>
<text x="136" y="179" font-size="15">Blue</text>
<circle cx="288" cy="213" r="13" fill="#403478" stroke="#3a3730"/>
<text x="288" y="218" font-size="15" fill="#fff">6</text>
<text x="288" y="189" font-size="15">Indigo</text>
<circle cx="64" cy="213" r="13" fill="#8c4488" stroke="#3a3730"/>
<text x="64" y="218" font-size="15" fill="#fff">7</text>
<text x="64" y="189" font-size="15">Violet</text>
<rect x="74" y="347" width="172" height="31" rx="5" fill="#e6e8e9" stroke="#a7acae"/>
<text x="160" y="368" font-size="15">Read the tablet first</text>
<text x="160" y="397" font-size="13">To reset, read the tablet again.</text>
</g></svg>
